<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="main">
    <div class="card">
      <div class="inputbox">
        <input type="text" placeholder="Enter city name" spellcheck="false" />
        <button><img src="search.png" alt="Search" /></button>
      </div>

      <div class="weather">
        <img src="clouds.png" alt="Weather" class="weather-img" />
        <h3 class="condition">Cloudy</h3>
        <h1 id="temp">22°C</h1>
        <h2 id="city">New York</h2>
      </div>

      <div class="details">
        <div class="humidity detail-box">
          <img src="humidity.png" alt="Humidity" />
          <div>
            <h2 class="humidity-val">50%</h2>
            <p>Humidity</p>
          </div>
        </div>

        <div class="wind detail-box">
          <img src="wind.png" alt="Wind" />
          <div>
            <h2 class="wind-val">15 km/h</h2>
            <p>Wind Speed</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
