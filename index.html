<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="main">
    <div class="card">
      <div class="inputbox">
        <input type="text" placeholder="Enter city name..." spellcheck="false" />
        <button><img src="search.png" alt="Search" /></button>
      </div>

      <div class="value">
        <img src="clouds.png" alt="Weather Icon" class="weather-img" />
        <h3 class="condition">--</h3>
        <h1 id="temp">--°C</h1>
        <h2 id="city">City Name</h2>
      </div>

      <div class="humair">
        <div class="humid">
          <img src="humidity.png" alt="Humidity" />
          <div class="contain">
            <h2 class="humidity-val">--%</h2>
            <h4>Humidity</h4>
          </div>
        </div>
        <div class="wind">
          <img src="wind.png" alt="Wind" />
          <div class="contain">
            <h2 class="wind-val">-- km/h</h2>
            <h4>Wind</h4>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
